name: Weekly Patching

# Triggered LOCALLY by weekly-patching-dispatch.timer on dockerhost (Sat 09:47 UTC),
# NOT by GitHub's cron. GitHub stopped emitting scheduled-trigger events for this account on
# 2026-08-26, and late ticks drifted 11-12h - which would drain and reboot cluster nodes at
# night, the exact thing the 09:47 UTC slot was chosen to avoid.
# See vault note "2026-08-29 GitHub Actions Scheduled Runs Stopped Firing".
# Dropping the cron trigger also exempts this workflow from the 60-day inactivity auto-disable.
on:
  workflow_dispatch:

concurrency:
  group: weekly-patching
  cancel-in-progress: false

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write inventory from secret
        run: |
          mkdir -p inventory
          printf '%s\n' "${{ secrets.ANSIBLE_HOSTS }}" > inventory/hosts

      - name: Run weekly patching
        run: |
          set -o pipefail
          ansible-playbook -i inventory/hosts site.yml | tee /tmp/maintenance.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Weekly Patching — $(date)"
            echo ""
            if grep -q "PLAY RECAP" /tmp/maintenance.log 2>/dev/null; then
              echo '```'
              sed -n '/PLAY RECAP/,$p' /tmp/maintenance.log
              echo '```'
            fi
            echo ""
            echo "**Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Datadog heartbeat (2026-09-13). CI Visibility's own monitors cannot look back
      # more than 2 days, so a "no patch run in a week" alert needs a metric: one count
      # per run tagged with the job status. Monitor "[CI] Weekly Patching has not
      # succeeded in the last week" alerts when a week passes with no status:success.
      #
      # The Datadog API key is read from 1Password at run time with the repo's existing
      # service-account token - no second copy of the key in GitHub, rotation happens in
      # 1Password only. Best-effort: neither a 1Password nor a Datadog outage may fail
      # the patch run, so every failure path exits 0.
      - name: Datadog heartbeat
        if: always()
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          export PATH="$PATH:/home/linuxbrew/.linuxbrew/bin"   # runner service is a non-login shell; op is a brew install
          command -v op >/dev/null || { echo "op CLI not on runner; skipping heartbeat"; exit 0; }
          DD_API_KEY="$(op read 'op://k8s-cluster-secrets/datadog-secret/api-key' 2>/dev/null)"
          [ -n "$DD_API_KEY" ] || { echo "could not read Datadog key from 1Password (service account lacks the vault?); skipping heartbeat"; exit 0; }
          curl -sS --max-time 15 -o /dev/null -w 'datadog heartbeat http=%{http_code}\n' \
            -X POST https://api.us5.datadoghq.com/api/v2/series \
            -H "DD-API-KEY: $DD_API_KEY" -H "Content-Type: application/json" \
            -d "{\"series\":[{\"metric\":\"ci.weekly_patching.run\",\"type\":1,\"points\":[{\"timestamp\":$(date +%s),\"value\":1}],\"tags\":[\"status:$JOB_STATUS\",\"repo:ansible-collection-ubuntu-patching\",\"workflow:weekly-patching\",\"env:prod\"]}]}" \
            || echo "datadog heartbeat failed (ignored)"
          exit 0
