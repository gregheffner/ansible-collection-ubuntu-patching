name: Weekly Patching

# Triggered LOCALLY by weekly-patching-dispatch.timer on dockerhost (Sat 09:47 UTC),
# NOT by GitHub's cron. GitHub stopped emitting scheduled-trigger events for this account on
# 2026-08-26, and late ticks drifted 11-12h - which would drain and reboot cluster nodes at
# night, the exact thing the 09:47 UTC slot was chosen to avoid.
# See vault note "2026-08-29 GitHub Actions Scheduled Runs Stopped Firing".
# Dropping the cron trigger also exempts this workflow from the 60-day inactivity auto-disable.
on:
  workflow_dispatch:

concurrency:
  group: weekly-patching
  cancel-in-progress: false

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write inventory from secret
        run: |
          mkdir -p inventory
          printf '%s\n' "${{ secrets.ANSIBLE_HOSTS }}" > inventory/hosts

      - name: Run weekly patching
        run: |
          set -o pipefail
          ansible-playbook -i inventory/hosts site.yml | tee /tmp/maintenance.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Weekly Patching — $(date)"
            echo ""
            if grep -q "PLAY RECAP" /tmp/maintenance.log 2>/dev/null; then
              echo '```'
              sed -n '/PLAY RECAP/,$p' /tmp/maintenance.log
              echo '```'
            fi
            echo ""
            echo "**Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Datadog heartbeat (2026-09-13). CI Visibility's own monitors cannot look back
      # more than 2 days, so a "no patch run in a week" alert needs a metric: one count
      # per run tagged with the job status. Monitor "[CI] Weekly Patching has not
      # succeeded in the last week" alerts when a week passes with no status:success.
      #
      # The Datadog API key comes from the DD_API_KEY repo secret if set, otherwise from
      # 1Password at run time with the repo's service-account token. 1Password is preferred
      # (rotation in one place, no second copy of the key in GitHub); the secret exists as a
      # fallback for when the service account cannot reach k8s-cluster-secrets.
      # Best-effort: neither a 1Password nor a Datadog outage may fail the patch run, so
      # every failure path still exits 0 - but it exits LOUDLY.
      #
      # 2026-09-19: this step had been silently skipping since it was added on 09-13. The
      # service-account token (last rotated 2025-11-29) has no grant on k8s-cluster-secrets,
      # so `op read` returned empty, the step printed one line nobody read and exited 0, and
      # ci.weekly_patching.run never received a single point. Monitor 22461630 uses
      # default_zero(), so a metric that never existed reads as 0 and the monitor sat in
      # Alert for six days claiming patching had not succeeded while it was succeeding.
      # Hence: real ::warning:: annotations and a line in the job summary on every failure
      # path, and the POST's HTTP status is checked rather than assumed.
      - name: Datadog heartbeat
        if: always()
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          OP_ITEM: op://k8s-cluster-secrets/datadog-secret/api-key
        run: |
          set +e
          export PATH="$PATH:/home/linuxbrew/.linuxbrew/bin"   # runner service is a non-login shell; op is a brew install

          warn() {   # loud: annotation on the run + a line in the job summary, never fatal
            echo "::warning title=Datadog heartbeat::$1"
            echo "- :warning: **Datadog heartbeat skipped** - $1" >> "$GITHUB_STEP_SUMMARY"
          }

          DD_API_KEY="${{ secrets.DD_API_KEY }}"
          KEY_SRC="DD_API_KEY repo secret"

          if [ -z "$DD_API_KEY" ]; then
            KEY_SRC="1Password ($OP_ITEM)"
            if ! command -v op >/dev/null; then
              warn "op CLI not on the runner and no DD_API_KEY secret set; ci.weekly_patching.run will have no point for this run."
              exit 0
            fi
            OP_ERR="$(op read "$OP_ITEM" 2>&1 >/dev/null)"
            DD_API_KEY="$(op read "$OP_ITEM" 2>/dev/null)"
            if [ -z "$DD_API_KEY" ]; then
              warn "could not read the Datadog key from 1Password. op said: ${OP_ERR:-<no stderr>}. Grant the service account read on the k8s-cluster-secrets vault, or set a DD_API_KEY repo secret. Monitor 22461630 will stay in Alert until a point lands."
              exit 0
            fi
          fi

          # A trailing newline from `op read` or a pasted secret would corrupt the header.
          DD_API_KEY="$(printf '%s' "$DD_API_KEY" | tr -d ' \r\n')"

          HTTP="$(curl -sS --max-time 15 -o /tmp/dd-hb.out -w '%{http_code}' \
            -X POST https://api.us5.datadoghq.com/api/v2/series \
            -H "DD-API-KEY: $DD_API_KEY" -H "Content-Type: application/json" \
            -d "{\"series\":[{\"metric\":\"ci.weekly_patching.run\",\"type\":1,\"points\":[{\"timestamp\":$(date +%s),\"value\":1}],\"tags\":[\"status:$JOB_STATUS\",\"repo:ansible-collection-ubuntu-patching\",\"workflow:weekly-patching\",\"env:prod\"]}]}")"

          case "$HTTP" in
            2*) echo "datadog heartbeat ok (http=$HTTP, status:$JOB_STATUS, key from $KEY_SRC)"
                echo "- :white_check_mark: Datadog heartbeat posted (\`status:$JOB_STATUS\`)" >> "$GITHUB_STEP_SUMMARY" ;;
            *)  warn "Datadog rejected the heartbeat (http=${HTTP:-none}, key from $KEY_SRC): $(head -c 200 /tmp/dd-hb.out 2>/dev/null)" ;;
          esac
          exit 0
