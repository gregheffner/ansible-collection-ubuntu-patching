name: Weekly Patching

on:
  schedule:
    # GitHub schedule crons are UTC and often fire late (observed 5-74 min);
    # off-peak minute reduces the delay. 09:47 UTC Sat = 05:47 EDT / 04:47 EST,
    # so even a late fire + ~24 min run finishes before 07:00 Eastern.
    # (Old 06:00 UTC slot collided with apt-daily-upgrade.timer ~06:16 UTC —
    # still avoided.)
    - cron: '47 9 * * 6'
  workflow_dispatch:

jobs:
  patch:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write inventory from secret
        run: |
          mkdir -p inventory
          printf '%s\n' "${{ secrets.ANSIBLE_HOSTS }}" > inventory/hosts

      - name: Run weekly patching
        run: |
          set -o pipefail
          ansible-playbook -i inventory/hosts site.yml | tee /tmp/maintenance.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Weekly Patching — $(date)"
            echo ""
            if grep -q "PLAY RECAP" /tmp/maintenance.log 2>/dev/null; then
              echo '```'
              sed -n '/PLAY RECAP/,$p' /tmp/maintenance.log
              echo '```'
            fi
            echo ""
            echo "**Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
